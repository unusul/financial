# Deploys the app to GitHub Pages, filling in the configuration from the repository variables
# (Settings → Secrets and variables → Actions → Variables). The code only holds the __…__ placeholders.
# Empty or missing variable: the app hides the matching sync backend (Drive or Firebase). See SETUP.md.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with configuration
        env:
          G_CLIENT: ${{ vars.GOOGLE_CLIENT_ID }}
          FB_KEY: ${{ vars.FB_API_KEY }}
          FB_DB: ${{ vars.FB_DATABASE_URL }}
        run: |
          mkdir _site
          # app files only: no dati/, tools/ or docs
          cp -r index.html sw.js manifest.webmanifest icons _site/
          sed -i -e "s|__G_CLIENT__|${G_CLIENT}|" -e "s|__FB_KEY__|${FB_KEY}|" -e "s|__FB_DB__|${FB_DB}|" _site/index.html
          # version shown in Altro: VERSIONE from sw.js plus commit and build time
          APPV=$(sed -n 's/^const VERSIONE = "\(.*\)";.*/\1/p' sw.js)
          BUILD="${GITHUB_SHA::7} del $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
          sed -i -e "s|__APPV__|${APPV}|" -e "s|__BUILD__|${BUILD}|" _site/index.html
          for v in G_CLIENT FB_KEY FB_DB; do [ -n "${!v}" ] || echo "::warning::variable ${v} is empty: the sync backend that needs it stays hidden"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
