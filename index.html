  return Object.values(G).map(g=>{const l=g.l.sort((p,q)=>p.d-q.d),ms=new Set(l.map(t=>mk(t.d))).size,last=l[l.length-1],a0=-l[0].x,a1=-last.x,r3=l.slice(-3),mo=r3.reduce((s,t)=>s-t.x,0)/r3.length;
    return{ok:g.rc||(ms>=6&&l.length/ms<=1.5&&now-last.d<=45*864e5),t:last,ms,mo,yr:l.reduce((s,t)=>s-t.x,0),up:a1>a0*1.02?a0:null,dn:a1<a0*.98?a0:null}})
    .filter(o=>o.ok).sort((p,q)=>q.mo-p.mo)}
function fxCard(){const l=fxList();if(!l.length)return"";const tm=l.reduce((s,o)=>s+o.mo,0),up=l.filter(o=>o.up!=null).length;

  <div class="sum"><span>Totale al mese<small>circa ${eur(tm*12)} all’anno</small></span><b class="neg">${eur(tm)}</b></div>
  ${l.map(o=>`<div class="row" onclick="edit('${o.t.i}')"><div class="m"><b>${lab(o.t)}</b><small>${esc(an(o.t.a))} · ${o.ms} mesi su 12 · ultimo ${dt(o.t.d)}${o.up!=null?` · <span class="neg">aumentato da ${eur(o.up)} a ${eur(-o.t.x)}</span>`:o.dn!=null?` · <span class="pos">sceso da ${eur(o.dn)} a ${eur(-o.t.x)}</span>`:""}</small></div><div class="r"><b>${eur(o.mo)}</b><small style="display:block" class="mut">${eur(o.yr)} in 12 mesi</small></div></div>`).join("")}</div>`}
/* Note ricorrenti: le note usate almeno 3 volte (minuscole, senza numeri finali: "ikea2" = "ikea") fanno da etichette,
   con totale speso e incassato su tutto lo storico; trasferimenti esclusi. Un tocco apre Movimenti cercando quella nota */
let ntN=40,ntL=[];
function ntCard(){const G={};S.T.forEach(t=>{if(t.b)return;const n=nNorm(t.n);if(!n)return;const g=G[n]||(G[n]={n,c:0,e:0,i:0,f:t.d,l:t.d});g.c++;if(t.x<0)g.e-=t.x;else g.i+=t.x;if(t.d<g.f)g.f=t.d;if(t.d>g.l)g.l=t.d});
  const l=Object.values(G).filter(g=>g.c>=3).sort((p,q)=>q.e+q.i-p.e-p.i);ntL=l;if(!l.length)return"";
  return `<div class="card"><h2>Note ricorrenti (${l.length})</h2><p class="mut">Le note che usi almeno 3 volte funzionano da etichette (persone, progetti, negozi): qui il totale di ciascuna su tutto lo storico, trasferimenti esclusi. Tocca una nota per vedere i suoi movimenti.</p>
  ${l.slice(0,ntN).map((g,k)=>`<div class="row" onclick="ntGo(${k})"><div class="m"><b>${esc(g.n)}</b><small>${g.c} movimenti · dal ${dt(g.f)} al ${dt(g.l)}</small></div><div class="r">${g.e?`<b class="neg">${eur(-g.e)}</b>`:""}${g.i?`<small style="display:block" class="pos">+${eur(g.i)}</small>`:""}</div></div>`).join("")}
  ${l.length>ntN?`<p>${ib("chd","ntN+=40;render()","Mostra altre")}</p>`:""}</div>`}
function ntGo(k){const g=ntL[k];if(!g)return;F.q=g.n;F.a="";F.m="";F.y="";F.c=null;F.cl="";F.ids=null;F.rep=false;F.n=100;tab="list";render()}
/* Spese straordinarie: restano nei saldi, escono dai report (R.xo). Suggerite: almeno 3 volte la mediana della categoria (o della principale) e non meno di 300 €; senza statistiche, da 1.000 € */
let xoN=20;
// Statistiche per spese ed entrate separate (chiave: segno + categoria). th: soglia "molto sopra il solito";
// usual: nei 12 mesi prima ci sono altri 2 movimenti della stessa categoria e segno grandi almeno la metà, cioè un importo abituale (es. bollette, stipendio)
function xoStats(){const inc=new Set(S.A.filter(a=>a.tot).map(a=>a.i)),L=S.T.filter(t=>!t.b&&t.x&&inc.has(t.a));
  const sg=t=>t.x<0?"e":"i",tk=t=>{const c=t.c&&topc(t.c);return sg(t)+(c?c.i:"-")},fk=t=>sg(t)+(t.c||"-"),Lf={},Lt={},B={};
  L.forEach(t=>{(B[fk(t)]=B[fk(t)]||[]).push(t);if(t.xo)return;(Lf[fk(t)]=Lf[fk(t)]||[]).push(Math.abs(t.x));(Lt[tk(t)]=Lt[tk(t)]||[]).push(Math.abs(t.x))});
  const mth=M=>{const o={};for(const k in M)if(M[k].length>=5){const a=M[k].sort((p,q)=>p-q);o[k]=Math.max(30000,3*a[a.length>>1])}return o},tf=mth(Lf),tt=mth(Lt);
  const th=t=>tf[fk(t)]!=null?tf[fk(t)]:tt[tk(t)]!=null?tt[tk(t)]:100000;
  const usual=t=>(B[fk(t)]||[]).filter(x=>x!==t&&x.d<t.d&&x.d>=t.d-365*864e5&&Math.abs(x.x)>=Math.abs(t.x)/2).length>=2;
  return{L,th,usual}}
function xoSug(){const{L,th,usual}=xoStats();return L.filter(t=>t.xo==null&&Math.abs(t.x)>th(t)&&!usual(t)).sort((p,q)=>Math.abs(q.x)-Math.abs(p.x))}
function xoCard(){const sg=xoSug(),mk=S.T.filter(t=>t.xo).sort((p,q)=>Math.abs(q.x)-Math.abs(p.x)),sm=l=>{const e=l.reduce((s,t)=>s+(t.x<0?-t.x:0),0),i=l.reduce((s,t)=>s+(t.x>0?t.x:0),0);return [e?"spese "+eur(e):"",i?"entrate "+eur(i):""].filter(Boolean).join(" · ")},{usual}=xoStats();
  const ui=t=>usual(t)?`<button class="b g ic" title="Importo abituale: nei 12 mesi prima ci sono almeno altri 2 movimenti della stessa categoria grandi almeno la metà. Forse non è straordinario" aria-label="Perché forse non è straordinario" onclick="toast(this.title)" style="color:var(--acc)">${ic("info")}</button>`:"";
  if(!sg.length&&!mk.length)return"";
  const it=(t,b)=>rows([t],1)+`<p style="display:flex;gap:10px;margin:2px 0 10px">${b}</p>`;
  return `<div class="card"><h2>Movimenti straordinari</h2><p class="mut">Spese ed entrate straordinarie restano nei saldi, ma escono dai report finché in Report è attivo il pulsante con il fulmine. Da valutare: movimenti molto sopra il solito per la loro categoria (almeno 3 volte la mediana e non meno di 300 €, spese ed entrate separate), esclusi gli importi che nei 12 mesi prima si erano già visti almeno 2 volte. Tra le segnate, la i indica quelle che questa regola considera abituali.</p>
  ${sg.length?`<h2 style="font-size:15px;margin-top:14px">Da valutare (${sg.length} · ${sm(sg)})</h2>`+sg.slice(0,xoN).map(t=>it(t,ib("xo","xoSet('"+t.i+"',1)","Segna come straordinario","p")+ib("x","xoSet('"+t.i+"',0)","Non è straordinario: togli dai suggerimenti"))).join("")+(sg.length>xoN?`<p>${ib("chd","xoN+=20;render()","Mostra altri")}</p>`:""):""}
  ${mk.length?`<details style="margin-top:14px"><summary><b>Segnati (${mk.length} · ${sm(mk)})${mk.some(usual)?" · "+mk.filter(usual).length+" con la i":""}</b></summary>${mk.filter(usual).concat(mk.filter(t=>!usual(t))).map(t=>it(t,ib("x","xoSet('"+t.i+"')","Togli il segno di straordinario")+ui(t))).join("")}</details>`:""}</div>`}
function xoSet(i,v){const t=S.T.find(x=>x.i===i);if(!t)return;if(v==null)delete t.xo;else t.xo=v;save();toast(v?"Segnato come straordinario":v===0?"Tolto dai suggerimenti":"Segno tolto");render()}
const appInfo=()=>cfg(APPV)?"Versione "+esc(APPV)+(cfg(BUILD)?" · build "+esc(BUILD):""):"Versione locale, non pubblicata";

  if(d.scales&&d.scales.linear&&d.scales.linear.ticks){if(!pvApply.o)pvApply.o=d.scales.linear.ticks.callback;d.scales.linear.ticks.callback=PV?()=>"":pvApply.o}

/* ---------- Dati: migrazione, JSON, CSV, cancellazione ---------- */
let dm=null; // conferma in corso: {k:"json",j,name} oppure {k:"del"}
const nTot=o=>`${(o.A||[]).length} conti, ${(o.C||[]).length} categorie, ${(o.T||[]).length} movimenti`;
const drvW=()=>gOn()?" "+gName()+" è collegato: alla prossima sincronizzazione la modifica arriva anche lì e sugli altri dispositivi.":"";
const NEWS=()=>({A:[],C:[],T:[],D:[],L:{},RC:[],LN:[],V:[]});
function datiCard(){
  const row=(t,d,b)=>`<div class="row" style="cursor:default"><div class="m"><b style="white-space:normal">${t}</b><small>${d}</small></div>${b}</div>`;
  const fb=(id,t,acc)=>`<label class="fb" title="${t}" aria-label="${t}">${ic("up")}<input type="file" id="${id}"${acc?` accept="${acc}"`:""}></label>`;
  let w="";
  if(dm&&dm.k==="json")w=`<div class="card" style="border-color:var(--out);margin:0 0 12px"><b class="neg">Sostituire tutti i dati?</b><p class="mut">Stai importando <b>${esc(dm.name)}</b> (${nTot(dm.j)}). Tutti i dati attuali (${nTot(S)}) verranno <b>cancellati e sostituiti</b>: dall’app non si può annullare.${esc(drvW())} Per tenerli, esporta prima un JSON.</p><div style="display:flex;gap:10px"><button class="b g" onclick="dm=null;render()">Annulla</button><button class="b d" onclick="dmJson()">Cancella e importa</button></div></div>`;
  if(dm&&dm.k==="del")w=`<div class="card" style="border-color:var(--out);margin:0 0 12px"><b class="neg">Cancellare tutti i dati?</b><p class="mut">Verranno eliminati ${nTot(S)}, con ricorrenze e mutui. Non si può annullare.${esc(drvW())} Per tenerli, esporta prima un JSON. Scrivi <b>CANCELLA</b> per confermare.</p><input id="dc" autocomplete="off" oninput="$('#dcb').disabled=this.value.trim().toUpperCase()!=='CANCELLA'" style="margin-bottom:10px"><div style="display:flex;gap:10px"><button class="b g" onclick="dm=null;render()">Annulla</button><button class="b d" id="dcb" disabled onclick="delAll()">Cancella tutto</button></div></div>`;
  return `<div class="card"><h2>Dati</h2>${w}
  ${row("Migrazione da Financisto","Importa il file .backup: i movimenti già importati vengono aggiornati senza duplicati, quelli creati qui restano intatti.",fb("fi","Importa backup di Financisto"))}
  ${row("Importa JSON","Sostituisce tutti i dati con quelli del file: i dati attuali vengono cancellati.",fb("fj","Importa JSON","application/json,.json"))}
  ${row("Backup online",gOn()?"Copia completa dei dati in "+gName()+": restano le ultime "+BKN+". Il ripristino sostituisce tutti i dati, come Importa JSON.":"Collega Google Drive o Firebase in Sincronizzazione per inviare e ripristinare copie dei dati.",gOn()?ib("up","bkSend()","Invia backup","p")+ib("rest","bkShow()",bkL?"Chiudi l’elenco dei backup":"Ripristina da un backup"):"")}
  <p class="mut" id="bkm" style="margin:0">${esc(bkM)}</p>${bkL&&bkL.length?bkL.map((o,i)=>`<div class="row" style="cursor:default"><div class="m"><b>${bkDt(o.t)}</b><small>${o.n} movimenti</small></div>${ib("rest","bkPick("+i+")","Ripristina questo backup","d")}</div>`).join(""):""}
  ${row("Esporta JSON","Copia completa dei dati, per backup o per spostarli su un altro dispositivo.",ib("dl","exp()","Esporta JSON"))}
  ${row("Esporta CSV","Un movimento per riga, da aprire con Excel o Fogli Google.",ib("dl","expCsv()","Esporta CSV"))}
  ${row("Cancella dati","Elimina tutto da questo dispositivo.",ib("trash","dm={k:'del'};render()","Cancella dati","d"))}
  <p class="mut" id="fm"></p></div>`}
function dmJson(){const j=dm.j;dm=null;try{localStorage.setItem(K+"_prev",JSON.stringify(S))}catch(e){}
  S={...NEWS(),...j};S.G={};S.E=Date.now();snap();persist();syncSoon();toast("Dati sostituiti");render()}
function delAll(){dm=null;try{localStorage.removeItem(K+"_prev")}catch(e){}
  S=NEWS();S.G={};S.E=Date.now();snap();persist();syncSoon();toast("Dati cancellati");render()}
function expCsv(){
  const q=v=>{v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},n=c=>((c||0)/100).toFixed(2).replace(".",",");
  const L=["Data;Tipo;Conto;Conto destinazione;Categoria;Importo;Importo destinazione;Nota"];
  S.T.slice().sort((a,b)=>a.d-b.d).forEach(t=>{const k=kind(t);
    L.push([loc(t.d).replace("T"," "),k==="t"?"trasferimento":k==="e"?"spesa":"entrata",q(an(t.a)),k==="t"?q(an(t.b)):"",t.c?q(path(t.c)):"",n(t.x),k==="t"?n(t.y):"",q(t.n)].join(";"))});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download="financial-movimenti-"+new Date().toISOString().slice(0,10)+".csv";a.click();toast("Esportati "+S.T.length+" movimenti")}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="financial-"+new Date().toISOString().slice(0,10)+".json";a.click()}
async function imp(f,only){
  if(!f)return;const m=$("#fm");m.textContent="Lettura in corso…";
  try{
    const buf=new Uint8Array(await f.arrayBuffer());let txt;
    if(buf[0]===0x1f&&buf[1]===0x8b)txt=window.DecompressionStream?await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text():pako.ungzip(buf,{to:"string"});else txt=new TextDecoder().decode(buf);
    if(txt.trim().startsWith("{")){const j=JSON.parse(txt);if(!Array.isArray(j.T)||!Array.isArray(j.A))throw new Error("non è un file JSON di questa app");dm={k:"json",j,name:f.name};m.textContent="";render();return}
    if(only==="json")throw new Error("il file non è un JSON esportato da questa app");
    const E={};let cur=null;
    for(const l of txt.split("\n")){if(l.startsWith("$ENTITY:")){cur={};(E[l.slice(8).trim()]=E[l.slice(8).trim()]||[]).push(cur)}else if(l.trim()==="$$")cur=null;else if(cur){const k=l.indexOf(":");if(k>0)cur[l.slice(0,k)]=l.slice(k+1).replace(/\r$/,"")}}
    if(!E.transactions)throw new Error("Non sembra un backup di Financisto");
    (E.account||[]).forEach(a=>{const o={i:"f"+a._id,n:a.title,t:a.type,on:a.is_active==="1",tot:a.is_include_into_totals==="1",so:parseInt(a.sort_order)||0},k=S.A.findIndex(x=>x.i===o.i);
    if(k<0)S.A.push(o);else{const x=S.A[k];if(x.lk){if(!x.sl)x.so=o.so}else S.A[k]={...o,so:x.sl?x.so:o.so,sl:x.sl}}});
    const st=[];(E.category||[]).sort((a,b)=>a.left-b.left).forEach(c=>{while(st.length&&+st[st.length-1].right<+c.right)st.pop();const o={i:"f"+c._id,n:c.title,p:st.length?mapc("f"+st[st.length-1]._id):null},k=S.C.findIndex(x=>x.i===o.i);if(!(S.M&&S.M[o.i]))k<0?S.C.push(o):S.C[k]={...o,ar:S.C[k].ar,...(S.C[k].lk?{n:S.C[k].n,p:S.C[k].p,lk:1}:{})};st.push(c)});
    const keep=S.T.filter(t=>t.s==="a"),have=new Set(keep.map(t=>t.i).concat(S.D)),xoK={};S.T.forEach(t=>{if(t.s==="f"&&t.xo!=null)xoK[t.i]=t.xo});
    const nw=E.transactions.filter(t=>t.is_template==="0"&&t.parent_id==="0").map(t=>({i:"f"+t._id,d:+t.datetime,a:"f"+t.from_account_id,b:t.to_account_id!=="0"?"f"+t.to_account_id:null,c:t.category_id>0?mapc("f"+t.category_id):null,x:+t.from_amount,y:+t.to_amount,n:t.note||"",s:"f"})).filter(t=>!have.has(t.i));
    nw.forEach(t=>{if(t.i in xoK)t.xo=xoK[t.i]});S.T=keep.concat(nw);save();toast("Importati "+nw.length+" movimenti");render();
  }catch(e){m.textContent="Importazione non riuscita: "+e.message}
}
